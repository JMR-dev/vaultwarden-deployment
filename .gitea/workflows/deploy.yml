# Deploy one stack: Caddy image -> Pulumi (VM + disk) -> Ansible over IAP,
# then, for disposable only, the end-to-end checks.
#
#   workflow_dispatch -> disposable (any ref) or production (main only)
#
# Dispatch only. disposable is a temporary stack that exists only during a test
# cycle (runbook §2.9), so a push has nothing to deploy to; production changes
# when you choose to dispatch it.
#
# image, infra and configure authenticate with the deployer SA key in the repo
# secret GCP_DEPLOYER_KEY: Gitea 28.2's Actions still issue no OIDC token that
# GCP accepts (go-gitea/gitea#33681). That SA can rebuild the VM and read the
# secrets Ansible renders; it cannot grant IAM, touch DNS, or read platform
# state -- see platform/main.go. Every job that authenticates with it ends
# with the key-removal step, because composite actions have no post hook.
#
# verify holds no key: its runner gets the vaultwarden-e2e@ account through
# GKE Workload Identity, and that account reaches vault-disposable alone.
name: deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        options: [disposable, production]
        default: disposable
      allow_replace:
        description: Allow replacing or deleting the VM or its data disk (downtime + Let's Encrypt re-issue)
        type: boolean
        default: false
      signups:
        description: Production only (disposable always opens them for the verify job, which closes them). Open account signups to create the first account on a fresh stack. Registration works only through an IAP tunnel (runbook §2.8) and closes itself after 30 min; any later deploy closes it too
        type: boolean
        default: false

# The fallbacks match the dispatch defaults, in case `inputs` comes through empty.
env:
  STACK: ${{ inputs.stack || 'disposable' }}
  ALLOW_REPLACE: ${{ inputs.allow_replace || 'false' }}
  SIGNUPS: ${{ inputs.signups || 'false' }}
  IMAGE: us-east1-docker.pkg.dev/vaultwarden-497422/vaultwarden/caddy
  PULUMI_BACKEND_URL: gs://vaultwarden-497422-pulumi-state

# One deploy per stack at a time; never cancel one mid-`pulumi up`.
concurrency:
  group: deploy-${{ inputs.stack || 'disposable' }}
  cancel-in-progress: false

jobs:
  guard:
    # A few seconds of bash. On ubuntu-latest it waited minutes for a pod slot
    # and a burst node; the DinD runner on the always-on base node takes it at
    # once, and image runs there next anyway.
    runs-on: docker
    steps:
      - name: Validate stack and ref
        run: |
          case "$STACK" in
            disposable) ;;
            production)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "production deploys only from main (got $GITHUB_REF)" >&2
                exit 1
              fi
              ;;
            *) echo "unknown stack: $STACK" >&2; exit 1 ;;
          esac
          echo "Deploying $STACK from $GITHUB_REF @ ${GITHUB_SHA:0:12} (allow_replace=$ALLOW_REPLACE, signups=$SIGNUPS)"

  image:
    needs: guard
    # docker build/push needs a Docker daemon; ubuntu-latest job pods have none.
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: go gcloud
          credentials: ${{ secrets.GCP_DEPLOYER_KEY }}
      - name: Build, scan and push -- or promote the already-scanned build
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          if gcloud artifacts docker images describe "${IMAGE}:${sha}" >/dev/null 2>&1; then
            echo "${IMAGE}:${sha} already built and scanned; promoting it"
          else
            scripts/build-caddy.sh "${IMAGE}:${sha}"
            docker push "${IMAGE}:${sha}"
          fi
          # The floating per-stack tag podman auto-update watches on the host.
          # A manifest copy, not `gcloud artifacts docker tags add`: that moves
          # an existing tag by deleting it first (artifactregistry.tags.delete,
          # outside the deployer's writer role).
          scripts/retag-image.sh "${IMAGE}:${sha}" "${STACK}"
      - name: Remove deployer key
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcp-deployer.json"; rm -rf "${RUNNER_TEMP}/gcloud-config" "${HOME}/.docker/config.json"

  infra:
    needs: image
    # On-demand nodes with room for Pulumi: a spot preemption halfway
    # through `pulumi up` would leave the stack locked mid-change.
    runs-on: heavy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: go pulumi gcloud
          credentials: ${{ secrets.GCP_DEPLOYER_KEY }}
      - name: Build the Pulumi program
        working-directory: pulumi
        run: go build -o bin/vaultwarden .
      - name: Preview, with a guard on replacing the VM or its disk
        working-directory: pulumi
        run: |
          set -euo pipefail
          pulumi stack select "$STACK"
          pulumi preview --diff
          pulumi preview --json >"${RUNNER_TEMP}/preview.json"
          destructive="$(jq -r '
            .steps[]?
            | select(.op == "replace" or .op == "create-replacement" or .op == "delete-replaced" or .op == "delete")
            | select(.urn | test("::gcp:compute/(instance|disk):"))
            | "\(.op)\t\(.urn)"' "${RUNNER_TEMP}/preview.json")"
          if [[ -n "$destructive" ]]; then
            echo "Destructive changes to the VM or its data disk:"
            echo "$destructive"
            if [[ "$ALLOW_REPLACE" != "true" ]]; then
              echo "Refusing without allow_replace=true. A replacement is ~15 min of downtime and" >&2
              echo "a new Let's Encrypt certificate (5 per week per name); snapshot the disk first." >&2
              exit 1
            fi
          fi
      - name: pulumi up
        working-directory: pulumi
        run: pulumi up --yes --skip-preview --stack "$STACK"
      - name: Remove deployer key
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcp-deployer.json"; rm -rf "${RUNNER_TEMP}/gcloud-config"

  configure:
    needs: infra
    # Same pool as infra: the node infra just freed is still up (scale-down
    # waits ~10 min), so this skips booting a burst node from zero.
    runs-on: heavy
    outputs:
      started: ${{ steps.start.outputs.epoch }}
    steps:
      # verify's telemetry check counts sudo's lines "since this deploy".
      - name: Note when configure started
        id: start
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: gcloud ansible
          credentials: ${{ secrets.GCP_DEPLOYER_KEY }}
      # disposable always opens signups, for verify's test account; Caddy
      # still lets registration in from IAP's range only, and verify closes
      # the window and disarms its timer when it's done (or the timer does,
      # after vaultwarden_signups_window_minutes). Production follows the
      # signups input.
      - name: Ansible over IAP
        run: |
          signups="$SIGNUPS"
          if [[ "$STACK" == disposable ]]; then
            signups=true
          fi
          scripts/ansible-iap.sh "$STACK" \
            -e "caddy_image=${IMAGE}:${STACK}" \
            -e "vaultwarden_signups_allowed=${signups}"
      - name: Remove deployer key
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcp-deployer.json"; rm -rf "${RUNNER_TEMP}/gcloud-config"

  # End-to-end checks of disposable: runbook §2.8, everything in §3 that can
  # prove itself, and the restore drill (scripts/e2e-disposable.sh; the
  # runbook lists what stays manual). Never production, four times over: the
  # `if:` below, the script's refusal of any other STACK, a hostname check on
  # the VM, and an identity whose every grant is conditioned to
  # vault-disposable (platform/main.go, grantE2E).
  verify:
    needs: configure
    if: (inputs.stack || 'disposable') == 'disposable'
    # The repo-scoped runner whose jobs run as the vaultwarden-e2e@ Google
    # account through GKE Workload Identity (the gitea repo's infra/). No key.
    runs-on: vaultwarden-e2e
    timeout-minutes: 50
    # The browsers and their libraries come with the image; bump the tag with
    # @playwright/test in e2e/package.json. It runs as root, which the IAP
    # tunnel on 127.0.0.1:443 needs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: gcloud
          workload-identity: "true"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: e2e/package.json
      - name: Install the browser tests
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      # One step: a tunnel opened in one step is gone by the next.
      - name: Check disposable end to end
        env:
          DEPLOY_STARTED: ${{ needs.configure.outputs.started }}
        run: scripts/e2e-disposable.sh
      # Only what the script put in e2e/artifacts/ after deleting the error
      # contexts and finding the run's password in none of the rest. Never
      # traces: they record what was typed, and this repo is public.
      - name: Upload screenshots and the HTML report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-disposable-report
          path: e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore
