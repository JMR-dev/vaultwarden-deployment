# Checks for every pull request. No secrets, no GCP access: nothing here can
# change infrastructure. Deploys are deploy.yml.
#
# Pull requests only. A push trigger as well ran every check twice per commit
# (push + pull_request), and those duplicate jobs held the shared runners while
# deploys queued behind them. main only changes through checked PRs.
name: ci

on:
  pull_request:

jobs:
  go:
    # Compiling against the pulumi-gcp SDK is memory-hungry; the heavy pool
    # is the runners' home for Pulumi builds (8 GiB, on demand).
    runs-on: heavy
    strategy:
      matrix:
        module: [pulumi, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: go
      - name: gofmt, vet, test, build
        working-directory: ${{ matrix.module }}
        # Two packages at a time: compiling several pulumi-gcp packages at once
        # (vet, test and build each compile) got the job OOM-killed at 8 GiB.
        env:
          GOFLAGS: -p=2
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then echo "gofmt needed: $unformatted"; exit 1; fi
          go vet ./...
          go test ./...
          go build -o /dev/null .

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: ansible
      - name: Syntax check (both stacks) and lint
        working-directory: ansible
        run: |
          pip install -q ansible-lint==26.9.0
          ansible-galaxy collection install -r requirements.yml -p .collections >/dev/null
          for stack in disposable production; do
            ansible-playbook -i "inventory/${stack}.yml" playbook.yml --syntax-check
          done
          ansible-lint

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo=""
          [[ "$(id -u)" == 0 ]] || sudo=sudo
          $sudo apt-get update -qq && $sudo apt-get install -y -qq --no-install-recommends shellcheck >/dev/null
          shellcheck -x scripts/*.sh backup/*.sh ansible/roles/mail/files/systemd-email \
            ansible/roles/quadlets/files/vaultwarden-container-watch \
            ansible/roles/quadlets/files/vaultwarden-signups-close \
            ansible/roles/fail2ban/files/fail2ban-digest

  caddy-image:
    # docker build needs a Docker daemon; ubuntu-latest job pods have none.
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: go
      - name: Build + Trivy scan (no push)
        run: scripts/build-caddy.sh "vaultwarden-caddy:ci-${GITHUB_SHA:0:12}"
