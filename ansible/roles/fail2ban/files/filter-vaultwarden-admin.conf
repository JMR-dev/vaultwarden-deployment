# Stricter filter for the /admin route.
#
# Vaultwarden logs admin-token failures distinctly. Three strikes inside a
# 10-minute window earns a 24-hour ban. /admin is only reachable through an
# IAP tunnel in this deploy, and the IAP range is in ignoreip (IAM already
# gates it), so a hit here from any other address means the IAP-range gate in
# the Caddyfile is misconfigured — worth a loud, fast response.

[Definition]
failregex = ^.*Invalid admin token.*IP: <ADDR>.*$

ignoreregex =
