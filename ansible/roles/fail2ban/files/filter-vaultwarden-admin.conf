# Stricter filter for the /admin route.
#
# Vaultwarden logs admin-token failures distinctly. Three strikes inside a
# 10-minute window earns a 24-hour ban. Because /admin is only reachable via
# WG in this deploy, a hit here means *either* (a) WG-gating misconfigured
# in Caddy, or (b) a peer's credentials are being abused — both worth a
# loud, fast response.

[Definition]
failregex = ^.*Invalid admin token.*IP: <ADDR>.*$

ignoreregex =
