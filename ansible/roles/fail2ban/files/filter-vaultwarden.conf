# Fail2Ban filter for Vaultwarden.
#
# Matches Vaultwarden's log lines for failed logins (incorrect password,
# invalid TOTP) and failed admin-token attempts. The "IP: <ADDR>" segment
# is what the regex captures.
#
# Real-IP wiring (Caddy → IP_HEADER=X-Forwarded-For in Vaultwarden env) must
# be in place — without it the IP is always Caddy's container IP and the
# jail bans the reverse proxy.

[Definition]
failregex = ^.*Username or password is incorrect\. Try again\. IP: <ADDR>.*$
            ^.*Invalid TOTP code.*IP: <ADDR>.*$
            ^.*Invalid 2FA provided\..*IP: <ADDR>.*$
            ^.*Invalid admin token.*IP: <ADDR>.*$

ignoreregex =

[Init]
journalmatch =
