# Managed by Ansible (roles/base). Keep the journal across reboots.
#
# The GCE AlmaLinux image ships no /var/log/journal, so journald's default
# Storage=auto keeps the journal in /run and every reboot erases it.
# dnf-automatic reboots for kernel updates. Persistent storage keeps the
# fail2ban bans the daily digest hasn't mailed yet (fail2ban-digest reads from
# a saved journal cursor) and the logs you'd want after an incident.
[Journal]
Storage=persistent
# The boot disk is 20 GB; journald's default cap is 10% of the filesystem.
SystemMaxUse=1G
