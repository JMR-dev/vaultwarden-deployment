---
# Materialize SOPS-encrypted material onto the host:
#
#   * Single-value secrets (ADMIN_TOKEN, GCP SA JSON) → Podman secrets,
#     consumed by quadlets via `Secret=name,type=...`.
#   * Multi-value env files (restic) → mode-0600 env files owned by the
#     service user, consumed by systemd EnvironmentFile=.
#
# All decryption happens on the controller (operator's laptop). The host
# never holds the SOPS age key.

- name: Stage directory for systemd env files
  ansible.builtin.file:
    path: /etc/vaultwarden
    state: directory
    owner: root
    group: "{{ vault_user }}"
    mode: "0750"

- name: Load Vaultwarden secrets from Secret Manager
  ansible.builtin.set_fact:
    vw_secrets: >-
      {{ lookup('community.general.pipe',
                'gcloud secrets versions access latest --secret=' + secret_prefix + 'vaultwarden --project=' + gcp_project)
         | from_yaml }}
  no_log: true

- name: Load restic backup env from Secret Manager
  ansible.builtin.set_fact:
    restic_secrets: >-
      {{ lookup('community.general.pipe',
                'gcloud secrets versions access latest --secret=' + secret_prefix + 'restic --project=' + gcp_project)
         | from_yaml }}
  no_log: true

- name: Load Healthchecks URLs from Secret Manager
  ansible.builtin.set_fact:
    hc_secrets: >-
      {{ lookup('community.general.pipe',
                'gcloud secrets versions access latest --secret=' + secret_prefix + 'healthchecks --project=' + gcp_project)
         | from_yaml }}
  no_log: true

- name: Write restic env file for the backup service
  ansible.builtin.copy:
    dest: /etc/vaultwarden/restic.env
    content: |
      RESTIC_REPOSITORY={{ restic_secrets.restic_repository }}
      RESTIC_PASSWORD={{ restic_secrets.restic_password }}
      AWS_ACCESS_KEY_ID={{ restic_secrets.r2_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ restic_secrets.r2_secret_access_key }}
    owner: root
    group: "{{ vault_user }}"
    mode: "0640"
  no_log: true

- name: Write Healthchecks env file
  ansible.builtin.copy:
    dest: /etc/vaultwarden/healthchecks.env
    content: |
      HC_BACKUP_URL={{ hc_secrets.hc_backup_url }}
      HC_RESTIC_CHECK_URL={{ hc_secrets.hc_restic_check_url }}
    owner: root
    group: "{{ vault_user }}"
    mode: "0640"
  no_log: true

# Podman secrets. `podman secret create --replace` is idempotent and rotates
# the secret if the source value changed.
#
# admin-token is always created — an empty value means Vaultwarden treats
# ADMIN_TOKEN as unset, which disables /admin entirely. That's the plan's
# fallback: admin disabled, manage via the vaultwarden CLI / direct DB.
- name: Create Podman secrets
  ansible.builtin.shell:
    cmd: |
      printf '%s' "$SECRET_VALUE" | podman secret create --replace {{ item.name }} -
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
    SECRET_VALUE: "{{ item.value }}"
  become: true
  become_user: "{{ vault_user }}"
  loop:
    - name: vaultwarden-admin-token
      value: "{{ vw_secrets.admin_token_argon2 | default('') }}"
    - name: gcp-sa-dns
      value: "{{ vw_secrets.gcp_sa_dns_json }}"
  no_log: true
  changed_when: true
