---
# Materialize secrets from Google Cloud Secret Manager onto the host:
#
#   * Single-value secrets (ADMIN_TOKEN, GCP SA JSON) → Podman secrets,
#     consumed by quadlets via `Secret=name,type=...`.
#   * Multi-value env files (restic, healthchecks) → mode-0640 env files
#     owned by root:vault_user, consumed by systemd EnvironmentFile=.
#
# All Secret Manager access happens on the controller (operator laptop via
# ADC, or the Gitea Actions runner via the deployer key). The host has no GCP
# identity. restic + healthchecks are per stack (vaultwarden-<stack>-*).

- name: Stage directory for systemd env files
  ansible.builtin.file:
    path: /etc/vaultwarden
    state: directory
    owner: root
    group: "{{ vault_user }}"
    mode: "0750"

- name: Load Vaultwarden secrets from Secret Manager
  ansible.builtin.set_fact:
    vw_secrets: >-
      {{ lookup('ansible.builtin.pipe',
                'gcloud secrets versions access latest --secret=' + secret_prefix + 'vaultwarden --project=' + gcp_project)
         | from_yaml }}
  no_log: true

# Fail fast on misconfigured Secret Manager content. An empty or malformed
# gcp_sa_dns_json silently breaks Caddy DNS-01; admin_token_argon2 can be
# empty (disables /admin, the documented default).
- name: Validate Vaultwarden secret contents
  ansible.builtin.assert:
    that:
      - vw_secrets.gcp_sa_dns_json is defined
      - vw_secrets.gcp_sa_dns_json | length > 0
      - vw_secrets.gcp_sa_dns_json | trim is match('^\\s*\\{')
    fail_msg: >-
      vw_secrets.gcp_sa_dns_json is missing, empty, or not JSON. Update the
      vaultwarden-vaultwarden secret in Secret Manager with the full
      service-account JSON (under gcp_sa_dns_json) and re-run.

- name: Load restic backup env from Secret Manager
  ansible.builtin.set_fact:
    restic_secrets: >-
      {{ lookup('ansible.builtin.pipe',
                'gcloud secrets versions access latest --secret=' + stack_secret_prefix + 'restic --project=' + gcp_project)
         | from_yaml }}
  no_log: true

- name: Validate restic secret contents
  ansible.builtin.assert:
    that:
      - restic_secrets.restic_repository | default('') | length > 0
      - restic_secrets.restic_password   | default('') | length > 0
      - restic_secrets.r2_access_key_id  | default('') | length > 0
      - restic_secrets.r2_secret_access_key | default('') | length > 0
    fail_msg: "{{ stack_secret_prefix }}restic is missing one of the required keys (restic_repository, restic_password, r2_access_key_id, r2_secret_access_key)."

- name: Load Healthchecks URLs from Secret Manager
  ansible.builtin.set_fact:
    hc_secrets: >-
      {{ lookup('ansible.builtin.pipe',
                'gcloud secrets versions access latest --secret=' + stack_secret_prefix + 'healthchecks --project=' + gcp_project)
         | from_yaml }}
  no_log: true

- name: Validate Healthchecks secret contents
  ansible.builtin.assert:
    that:
      - hc_secrets.hc_backup_url        | default('') | length > 0
      - hc_secrets.hc_restic_check_url  | default('') | length > 0
    fail_msg: "{{ stack_secret_prefix }}healthchecks is missing hc_backup_url or hc_restic_check_url."

- name: Write restic env file for the backup service
  ansible.builtin.copy:
    dest: /etc/vaultwarden/restic.env
    content: |
      RESTIC_REPOSITORY={{ restic_secrets.restic_repository }}
      RESTIC_PASSWORD={{ restic_secrets.restic_password }}
      AWS_ACCESS_KEY_ID={{ restic_secrets.r2_access_key_id }}
      AWS_SECRET_ACCESS_KEY={{ restic_secrets.r2_secret_access_key }}
    owner: root
    group: "{{ vault_user }}"
    mode: "0640"
  no_log: true

- name: Write Healthchecks env file
  ansible.builtin.copy:
    dest: /etc/vaultwarden/healthchecks.env
    content: |
      HC_BACKUP_URL={{ hc_secrets.hc_backup_url }}
      HC_RESTIC_CHECK_URL={{ hc_secrets.hc_restic_check_url }}
    owner: root
    group: "{{ vault_user }}"
    mode: "0640"
  no_log: true

# Podman secrets, replaced only when the value actually differs (compared by
# SHA-256 of the exact bytes, so trailing newlines can't cause false diffs).
# A container reads its secrets at start, so a real change restarts both
# containers (the handlers flush in the quadlets role, after daemon-reload).
#
# admin-token exists only while admin_token_argon2 is set. Podman refuses an
# empty secret, so "admin disabled" (the default; manage via the vaultwarden
# CLI / direct DB) means no secret and no Secret= line: the quadlets role adds
# the vaultwarden.container drop-in that consumes it only when it exists.
- name: Create or rotate Podman secrets
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      want="$(printf '%s' "$SECRET_VALUE" | sha256sum)"
      if podman secret exists "$SECRET_NAME" \
         && [[ "$(podman secret inspect --showsecret "$SECRET_NAME" | jq -j '.[0].SecretData' | sha256sum)" == "$want" ]]; then
        exit 0
      fi
      printf '%s' "$SECRET_VALUE" | podman secret create --replace "$SECRET_NAME" -
      echo CHANGED
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
    SECRET_NAME: "{{ item.name }}"
    SECRET_VALUE: "{{ item.value }}"
  become: true
  become_user: "{{ vault_user }}"
  loop: >-
    {{ [{'name': 'gcp-sa-dns', 'value': vw_secrets.gcp_sa_dns_json}]
       + ([{'name': 'vaultwarden-admin-token', 'value': vw_secrets.admin_token_argon2}]
          if (vw_secrets.admin_token_argon2 | default('', true) | length > 0) else []) }}
  register: podman_secrets
  no_log: true
  changed_when: "'CHANGED' in podman_secrets.stdout"
  notify:
    - restart vaultwarden
    - restart caddy

- name: Remove the admin-token Podman secret while admin is disabled
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      if podman secret exists vaultwarden-admin-token; then
        podman secret rm vaultwarden-admin-token >/dev/null
        echo CHANGED
      fi
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
  become: true
  become_user: "{{ vault_user }}"
  when: vw_secrets.admin_token_argon2 | default('', true) | length == 0
  register: admin_secret_rm
  changed_when: "'CHANGED' in admin_secret_rm.stdout"
  notify: restart vaultwarden
