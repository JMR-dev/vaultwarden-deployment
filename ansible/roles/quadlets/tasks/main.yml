---
# Deploys the quadlet files from ../quadlets/ and the Caddyfile from ../caddy/
# to the rootless vaultwarden user. Quadlet content is Phase 4; this role
# just owns the deployment + reload.

- name: Ensure quadlet target directory exists
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

- name: Ensure Caddy config directory exists
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/caddy"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

- name: Require caddy_image extra-var
  ansible.builtin.assert:
    that:
      - caddy_image is defined and caddy_image | length > 0
    fail_msg: >-
      caddy_image is required: the floating per-stack tag, e.g.
        -e caddy_image=us-east1-docker.pkg.dev/vaultwarden-497422/vaultwarden/caddy:<stack>
      (platform's `caddyImage` output plus ":<stack>"; deploy.yml passes it).

# The static vaultwarden.container can't read group_vars, but its
# SecurityLabelLevel must match the level the base role gives /data. A
# mismatch fails closed (Vaultwarden can't open /data), but catch it here
# with a clear message instead.
- name: Vaultwarden's quadlet runs at vaultwarden_selinux_level
  ansible.builtin.assert:
    that:
      - ('SecurityLabelLevel=' ~ vaultwarden_selinux_level) in lookup('ansible.builtin.file', playbook_dir ~ '/../quadlets/vaultwarden.container')
    fail_msg: >-
      quadlets/vaultwarden.container's SecurityLabelLevel differs from
      vaultwarden_selinux_level ({{ vaultwarden_selinux_level }}) in group_vars/all.yml.

# Plain copy, not ansible.posix.synchronize: synchronize opens its own
# rsync-over-ssh connection, which doesn't reliably inherit the IAP
# ProxyCommand and ephemeral OS Login key scripts/ansible-iap.sh sets up.
# A quadlet removed from the repo must be deleted on the host by hand.
- name: Install static quadlet files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/{{ vault_user }}/.config/containers/systemd/{{ item | basename }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  loop: "{{ query('fileglob', playbook_dir ~ '/../quadlets/*') | reject('search', '\\.j2$') | list }}"
  notify:
    - reload user systemd
    - restart vaultwarden
    - restart caddy

# /admin's token, only while admin_token_argon2 is set (Podman refuses an
# empty secret; see quadlets/vaultwarden.container). Skipped when the secrets
# role didn't run (e.g. --tags quadlets alone), so a partial run never turns
# /admin off by mistake.
- name: Ensure the vaultwarden.container drop-in directory exists
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/.config/containers/systemd/vaultwarden.container.d"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0755"
  when:
    - vw_secrets is defined
    - vw_secrets.admin_token_argon2 | default('', true) | length > 0

- name: Add the vaultwarden admin-token drop-in
  ansible.builtin.copy:
    dest: "/var/lib/{{ vault_user }}/.config/containers/systemd/vaultwarden.container.d/admin-token.conf"
    content: |
      [Container]
      Secret=vaultwarden-admin-token,type=env,target=ADMIN_TOKEN
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  when:
    - vw_secrets is defined
    - vw_secrets.admin_token_argon2 | default('', true) | length > 0
  notify:
    - reload user systemd
    - restart vaultwarden

- name: Remove the admin-token drop-in while admin is disabled
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/.config/containers/systemd/vaultwarden.container.d/admin-token.conf"
    state: absent
  when:
    - vw_secrets is defined
    - vw_secrets.admin_token_argon2 | default('', true) | length == 0
  notify:
    - reload user systemd
    - restart vaultwarden

# 0644 here too — quadlet files are read by Podman's quadlet generator
# (running as the rootless user's systemd-user-generator), which crosses
# the same namespace boundary as the container mounts above. 0640 risks
# the generator not seeing the unit on first activation.
- name: Template caddy.container with image from Pulumi
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../quadlets/caddy.container.j2"
    dest: "/var/lib/{{ vault_user }}/.config/containers/systemd/caddy.container"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  notify:
    - reload user systemd
    - restart caddy

# Mode 0644 (not 0640) is deliberate. These files hold non-secret config
# (VAULT_FQDN, ADMIN_CIDRS, DOMAIN — all public). Caddy runs in a distroless
# `:nonroot` container as uid 65532; with rootless Podman's default user
# namespace mapping, the container's nonroot uid is *outside* the host
# vault_user's subuid range, so a 0640 file owned by vault_user appears as
# 0:0 inside the container and is unreadable to Caddy. 0644 makes it
# readable as "other". On a single-purpose host, the wider mode has no
# practical exposure — no other UIDs are running.
- name: Sync Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../caddy/Caddyfile"
    dest: "/var/lib/{{ vault_user }}/caddy/Caddyfile"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  notify: restart caddy

- name: Render Caddyfile env vars
  ansible.builtin.copy:
    dest: "/var/lib/{{ vault_user }}/caddy/caddy.env"
    content: |
      VAULT_FQDN={{ vault_fqdn }}
      ADMIN_CIDRS={{ iap_range }}
      GCP_PROJECT={{ gcp_project }}
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  notify: restart caddy

# SIGNUPS_ALLOWED is true only for the one deploy that creates the operator's
# account on a fresh stack (group_vars/all.yml); the next deploy flips it back
# and the restart below makes that take effect.
- name: Render Vaultwarden env vars
  ansible.builtin.copy:
    dest: "/var/lib/{{ vault_user }}/vaultwarden.env"
    content: |
      DOMAIN=https://{{ vault_fqdn }}
      SIGNUPS_ALLOWED={{ vaultwarden_signups_allowed | bool | lower }}
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  notify: restart vaultwarden

- name: Create caddy data + log directories
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/caddy/{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"
  loop:
    - data
    - logs

# Coraza writes /var/log/caddy/coraza-audit.log inside the container, which
# bind-mounts out to /var/lib/<user>/caddy/logs/. SecAuditLog doesn't rotate
# itself; logrotate handles it on the host. copytruncate is required —
# Coraza holds the file open and we can't SIGHUP its writer.
- name: Install logrotate
  ansible.builtin.package:
    name: logrotate
    state: present

- name: Coraza audit logrotate config
  ansible.builtin.copy:
    dest: /etc/logrotate.d/coraza-audit
    content: |
      /var/lib/{{ vault_user }}/caddy/logs/coraza-audit.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
          su {{ vault_user }} {{ vault_user }}
      }
    owner: root
    group: root
    mode: "0644"

# Container-down alerting. A system timer, because the rootless units can't
# use OnFailure= (see the script's header).
- name: Install container watch script
  ansible.builtin.copy:
    src: vaultwarden-container-watch
    dest: /usr/local/sbin/vaultwarden-container-watch
    owner: root
    group: root
    mode: "0755"

- name: Install container watch service
  ansible.builtin.template:
    src: vaultwarden-container-watch.service.j2
    dest: /etc/systemd/system/vaultwarden-container-watch.service
    owner: root
    group: root
    mode: "0644"

- name: Install container watch timer
  ansible.builtin.copy:
    src: vaultwarden-container-watch.timer
    dest: /etc/systemd/system/vaultwarden-container-watch.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable container watch timer
  ansible.builtin.systemd:
    name: vaultwarden-container-watch.timer
    enabled: true
    state: started
    daemon_reload: true

# The signup window closes itself (group_vars vaultwarden_signups_allowed).
# A signups=true deploy arms a timer for a fixed wall-clock time, computed on
# the host. It's Persistent, so a reboot in between closes the window at
# boot. Any other deploy disarms it: the env file above already says false.
- name: Install the signup-window closer
  ansible.builtin.copy:
    src: vaultwarden-signups-close
    dest: /usr/local/sbin/vaultwarden-signups-close
    owner: root
    group: root
    mode: "0755"

- name: Install its service
  ansible.builtin.copy:
    src: vaultwarden-signups-close.service
    dest: /etc/systemd/system/vaultwarden-signups-close.service
    owner: root
    group: root
    mode: "0644"

- name: When the signup window closes
  ansible.builtin.command:
    cmd: date -u -d "+{{ vaultwarden_signups_window_minutes | int }} min" "+%Y-%m-%d %H:%M:%S UTC"
  register: signups_close_at
  changed_when: false
  when: vaultwarden_signups_allowed | bool

- name: Arm the signup-window timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/vaultwarden-signups-close.timer
    content: |
      [Unit]
      Description=Close the Vaultwarden signup window opened by a signups=true deploy

      [Timer]
      OnCalendar={{ signups_close_at.stdout }}
      Persistent=true
      AccuracySec=1min

      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: "0644"
  when: vaultwarden_signups_allowed | bool

- name: Start the signup-window timer
  ansible.builtin.systemd:
    name: vaultwarden-signups-close.timer
    enabled: true
    state: restarted
    daemon_reload: true
  when: vaultwarden_signups_allowed | bool

- name: Disarm the signup-window timer
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      timer=/etc/systemd/system/vaultwarden-signups-close.timer
      [[ -e "$timer" ]] || exit 0
      systemctl disable --now vaultwarden-signups-close.timer
      rm -f "$timer"
      systemctl daemon-reload
      echo CHANGED
    executable: /bin/bash
  register: signups_timer_disarm
  changed_when: "'CHANGED' in signups_timer_disarm.stdout"
  when: not (vaultwarden_signups_allowed | bool)

# Caddy's :443 is a systemd socket handed to the container, so Caddy sees
# real client addresses (files/caddy.socket says why).
- name: User systemd unit directory
  ansible.builtin.file:
    path: "/var/lib/{{ vault_user }}/.config/systemd/user"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0755"

- name: Install caddy.socket
  ansible.builtin.copy:
    src: caddy.socket
    dest: "/var/lib/{{ vault_user }}/.config/systemd/user/caddy.socket"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
  register: caddy_socket_unit
  notify: restart caddy

# Hand-over: while caddy.service holds :443 itself (an older PublishPort
# Caddy) or the socket unit changed, Caddy has to stop before the socket can
# (re)bind. The flush below restarts it on the socket.
- name: Listen on :443 through caddy.socket
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      systemctl --user daemon-reload
      if [[ "$SOCKET_CHANGED" == True ]] || ! systemctl --user is-active --quiet caddy.socket; then
        systemctl --user stop caddy.service
        systemctl --user restart caddy.socket
        echo CHANGED
      fi
      if ! systemctl --user is-enabled --quiet caddy.socket; then
        systemctl --user enable caddy.socket
        echo CHANGED
      fi
    executable: /bin/bash
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
    SOCKET_CHANGED: "{{ caddy_socket_unit.changed }}"
  become: true
  become_user: "{{ vault_user }}"
  register: caddy_socket_handover
  changed_when: "'CHANGED' in caddy_socket_handover.stdout"
  notify: restart caddy

# Apply unit/config changes now (daemon-reload, then targeted restarts),
# rather than at the end of the play after the backup role has run.
- name: Apply quadlet changes
  ansible.builtin.meta: flush_handlers

# Quadlet units are generated, not enabled: [Install] WantedBy only takes
# effect at boot. On a fresh host nothing would start them until a reboot, so
# start them explicitly (a no-op when already running).
- name: Ensure containers are running
  ansible.builtin.command:
    cmd: systemctl --user start vaultwarden.service caddy.service
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
  become: true
  become_user: "{{ vault_user }}"
  changed_when: false

# Roll the floating :<stack> tags now instead of waiting for the daily timer.
# Vaultwarden is health-gated (Notify=healthy), so a broken image is rolled
# back; Caddy (distroless, no shell for a HealthCmd) rolls back only if it
# fails to start.
- name: Pull and roll updated images
  ansible.builtin.command:
    cmd: podman auto-update
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vault_uid }}"
  become: true
  become_user: "{{ vault_user }}"
  register: auto_update
  changed_when: "'true' in auto_update.stdout"
  tags: [rollout]
