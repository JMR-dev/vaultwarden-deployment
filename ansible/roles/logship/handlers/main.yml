---
# Alloy only: nothing here restarts Vaultwarden or Caddy. Not fatal: the
# role's checks warn when Alloy isn't ready.
- name: restart alloy
  ansible.builtin.systemd_service:
    name: alloy.service
    state: restarted
    daemon_reload: true
  failed_when: false

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
