---
# firewalld and a hand-written nftables ruleset don't mix: a firewalld reload
# rewrites the ruleset underneath us.
#
# Keyed on systemd's LoadState, not service_facts. firewalld isn't installed
# on these images, but fail2ban.service and netavark-firewalld-reload.service
# reference it, so once they're loaded, service_facts lists a "not-found"
# firewalld.service. The systemd module then fails on it: "Could not find the
# requested service". Masking it anyway also keeps a later install inert.
- name: Stop and mask firewalld
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      load="$(systemctl show firewalld.service -p LoadState --value)"
      [[ "$load" == masked ]] && exit 0
      if [[ "$load" == loaded ]]; then
        systemctl disable --now firewalld.service
      fi
      systemctl mask firewalld.service
      echo CHANGED
    executable: /bin/bash
  register: firewalld_mask
  changed_when: "'CHANGED' in firewalld_mask.stdout"

- name: Install nftables ruleset
  ansible.builtin.template:
    src: main.nft.j2
    dest: /etc/nftables/main.nft
    owner: root
    group: root
    mode: "0600"
    validate: "nft -c -f %s"

# nftables.service is used at boot only (its ExecStart is a plain
# `nft -f /etc/sysconfig/nftables.conf`, no flush). Never `systemctl
# restart|reload nftables` at runtime: on EL both flush the whole ruleset,
# taking fail2ban's ban tables with it.
- name: Point nftables.service at our ruleset
  ansible.builtin.copy:
    dest: /etc/sysconfig/nftables.conf
    content: "include \"/etc/nftables/main.nft\"\n"
    owner: root
    group: root
    mode: "0644"

- name: Enable nftables at boot
  ansible.builtin.systemd:
    name: nftables.service
    enabled: true

# Load on every run, not just on change: `nft -f` replaces only our table, so
# this converges the live ruleset even if someone edited it by hand.
# Established SSH sessions (this one) survive via the ct state rule.
- name: Load ruleset
  ansible.builtin.command: nft -f /etc/nftables/main.nft
  changed_when: false
