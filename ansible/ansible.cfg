[defaults]
# No default inventory on purpose: inventory/ holds both stacks, and a bare
# `ansible-playbook playbook.yml` must never touch both. scripts/ansible-iap.sh
# always passes -i inventory/<stack>.yml.
roles_path = roles/
collections_path = .collections/
host_key_checking = True
retry_files_enabled = False
# Not `stdout_callback = yaml`: that plugin was removed in community.general
# 12, and loading it aborts every run.
stdout_callback = default
callback_result_format = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 7200
forks = 5
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
