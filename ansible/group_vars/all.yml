---
# Defaults shared across all hosts. Per-stack values (stack, vault_fqdn) live
# in inventory/<stack>.yml.

timezone: UTC

# Packages installed by the `base` role. EPEL provides msmtp/restic/fail2ban.
base_packages:
  - vim-enhanced
  - jq
  - sqlite
  - tar
  - rsync
  - bind-utils
  - tcpdump
  - lsof
  - policycoreutils-python-utils  # audit2allow, audit2why, sealert
  - setools-console

epel_packages:
  - restic
  - msmtp
  - fail2ban-server
  # fail2ban-server, not the `fail2ban` metapackage: that also pulls in
  # fail2ban-sendmail and fail2ban-firewalld, and the latter installs firewalld
  # (enabled) plus /etc/fail2ban/jail.d/00-firewalld.conf, which sets
  # banaction to firewallcmd-rich-rules. We use nftables-multiport directly
  # (set in jail.local).

# Rootless container user + data disk.
vault_user: vaultwarden
vault_uid: 1100
vault_data_dir: /data
# GCE exposes an attached disk as /dev/disk/by-id/google-<device_name>; the
# device name is set in pulumi/main.go (DataDiskDeviceName).
vault_data_device: /dev/disk/by-id/google-vault-data

# SELinux MCS levels, fixed and DISJOINT, so the vault's files on /data are
# private to the Vaultwarden container. Neither the internet-facing Caddy nor
# any other container can open them, even after a breakout into its own
# context. Both containers run as the host user that owns /data
# (Vaultwarden's root, and Caddy's nonroot via keep-id), so file permissions
# alone wouldn't stop that.
# - Why not `:Z`: it gives the same privacy but relabels the whole volume at
#   every start, and on the disk's root-only lost+found that fails.
# - Instead, the base role labels /data container_file_t at
#   vaultwarden_selinux_level (persistent fcontext + `restorecon -F`).
# - The quadlets run at these levels: SecurityLabelLevel= in the static
#   quadlets/vaultwarden.container (asserted equal by the quadlets role) and
#   in caddy.container.j2.
# Changing one means restorecon -F /data, then restarting both containers.
vaultwarden_selinux_level: "s0:c118,c492"
caddy_selinux_level: "s0:c219,c731"

# Google Cloud Secret Manager -- where Ansible pulls secrets from, on the
# controller (CI runner via the deployer key, or the operator's ADC). The VM
# itself has no Google identity.
gcp_project: vaultwarden-497422
secret_prefix: vaultwarden-
# Per-stack secrets (restic, healthchecks): vaultwarden-<stack>-<name>, so a
# disposable host can't ping production's checks or touch its backups.
stack_secret_prefix: "{{ secret_prefix }}{{ stack }}-"

# IAP TCP forwarding's fixed source range: the only path to SSH, and -- through
# a tunnel to :443 -- the only source Caddy lets reach /admin and account
# registration. Must match IAPRange in platform/main.go.
iap_range: 35.235.240.0/20

# Open account registration. Off except for the one deploy that creates the
# operator's account on a fresh stack (deploy.yml `signups` input). /admin is
# disabled by default, so this is the only way to create the first account.
# Three safeguards bound that window:
# - Caddy passes registration only from iap_range, so the account is created
#   through an IAP tunnel (runbook §2.8) and strangers get 404.
# - The window closes itself vaultwarden_signups_window_minutes after the
#   deploy (vaultwarden-signups-close.timer, Persistent, so a reboot can't
#   skip it), even if no signups=false redeploy follows.
# - Closing it mails root the list of every account in the vault.
vaultwarden_signups_allowed: false
vaultwarden_signups_window_minutes: 30

# dnf-automatic maintenance window.
dnf_reboot_window: "04:00"
dnf_reboot_dow: "Tue"

# Telemetry to watchtower (the watchtower-observability-stack repo; its
# docs/client-telemetry.md is the contract). roles/tunnel makes this host one
# of watchtower's agent peers over WireGuard, and roles/logship's Alloy ships
# the journal, drop-by-default (alloy/config.alloy), and host metrics through
# it. Switched per stack by observability_enabled in inventory/<stack>.yml
# (not here: playbook group_vars would override the inventory's value). Off,
# or with no peer, both roles remove what they installed.
#
# The peer's config is a secret in watchtower's project, one per stack, read
# on the controller by the deploy's identity: vaultwarden-deployer may read
# these two and nothing else there (watchtower's scripts/bootstrap.sh).
watchtower_gcp_project: watchtower-observe
watchtower_peer_secret: "wireguard-vaultwarden-{{ stack }}-peer"
# The env label: the stack, production or disposable.
observability_env: "{{ stack }}"
# wg-easy's range, the only route the tunnel may carry. A config routing
# anything else is refused (roles/tunnel).
watchtower_tunnel_cidr: 10.8.0.0/24
# wg-quick names the interface after its config file; roles/nftables drops
# anything that comes in on it.
watchtower_tunnel_interface: wg-watchtower
# Added when the config lacks them (watchtower sets both).
watchtower_tunnel_keepalive: 25
watchtower_tunnel_mtu: 1380

# watchtower.jasonmross.dev resolves to 10.8.0.1, inside the tunnel. Agents
# may only write, and only into this tenant (watchtower's Caddy forces it).
watchtower_loki_url: https://watchtower.jasonmross.dev:3100/loki/api/v1/push
watchtower_mimir_url: https://watchtower.jasonmross.dev:8080/api/v1/push
watchtower_tenant: jasonmross

# Grafana Alloy, the release zip for x86_64 from GitHub, pinned by the sha256
# its release publishes in SHA256SUMS. A bump changes both; CI's checks
# (.gitea/actions/setup) read them from here too.
alloy_version: v1.21.3
alloy_zip_sha256: 50d23af2d0f98c00beac6ce9a365693e60f87fb76b6cad6fe1d161e80588af6d
# A 2 GB host: the cap keeps an Alloy OOM from taking the vault with it.
alloy_memory_max: 256M
alloy_gomemlimit: 200MiB
