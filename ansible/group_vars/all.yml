---
# Defaults shared across all hosts. Per-stack values (stack, vault_fqdn) live
# in inventory/<stack>.yml.

timezone: UTC

# Packages installed by the `base` role. EPEL provides msmtp/restic/fail2ban.
base_packages:
  - vim-enhanced
  - jq
  - sqlite
  - tar
  - rsync
  - bind-utils
  - tcpdump
  - lsof
  - policycoreutils-python-utils  # audit2allow, audit2why, sealert
  - setools-console

epel_packages:
  - restic
  - msmtp
  - fail2ban
  # Deliberately NOT fail2ban-firewalld: it ships /etc/fail2ban/jail.d/00-
  # firewalld.conf which overrides banaction to firewallcmd-rich-rules.
  # We use nftables-multiport directly (set in jail.local).

# Rootless container user + data disk.
vault_user: vaultwarden
vault_uid: 1100
vault_data_dir: /data
# GCE exposes an attached disk as /dev/disk/by-id/google-<device_name>; the
# device name is set in pulumi/main.go (DataDiskDeviceName).
vault_data_device: /dev/disk/by-id/google-vault-data

# Google Cloud Secret Manager -- where Ansible pulls secrets from, on the
# controller (CI runner via the deployer key, or the operator's ADC). The VM
# itself has no Google identity.
gcp_project: vaultwarden-497422
secret_prefix: vaultwarden-
# Per-stack secrets (restic, healthchecks): vaultwarden-<stack>-<name>, so a
# disposable host can't ping production's checks or touch its backups.
stack_secret_prefix: "{{ secret_prefix }}{{ stack }}-"

# IAP TCP forwarding's fixed source range: the only path to SSH, and -- through
# a tunnel to :443 -- the only source Caddy lets reach /admin. Must match
# IAPRange in platform/main.go.
iap_range: 35.235.240.0/20

# Open account registration. Off except for the one deploy that creates the
# operator's account on a fresh stack (deploy.yml `signups` input), after which
# a normal redeploy locks it again. /admin is disabled by default, so this is
# the only way to create the first account.
vaultwarden_signups_allowed: false

# dnf-automatic maintenance window.
dnf_reboot_window: "04:00"
dnf_reboot_dow: "Tue"
