---
# Site playbook. Don't call ansible-playbook directly -- the host is reachable
# only over IAP with OS Login, which scripts/ansible-iap.sh sets up (ephemeral
# key, pinned host keys, IAP ProxyCommand):
#
#   scripts/ansible-iap.sh <stack> -e caddy_image=<registry>/caddy:<stack> [ansible args]
#
# The controller (CI runner or operator laptop) must be authed to GCP: the
# secrets roles shell out to `gcloud secrets versions access`.

- name: Vaultwarden host configuration
  hosts: all
  become: true
  # Facts need python3; gather them after the raw bootstrap below.
  gather_facts: false

  pre_tasks:
    # AlmaLinux 10 is dnf4 (python-based), so python3 is normally present.
    # Guard anyway: a missing interpreter fails every module with an opaque
    # error, and raw is the only thing that works without one.
    - name: Ensure python3 is present
      ansible.builtin.raw: command -v python3 >/dev/null || dnf -y install python3 python3-dnf
      register: python_bootstrap
      changed_when: "'Installed' in python_bootstrap.stdout"
      tags: [always]

    - name: Gather facts
      ansible.builtin.setup:
      tags: [always]

    - name: Verify SELinux is enforcing
      ansible.builtin.command: getenforce
      changed_when: false
      register: selinux_status
      failed_when: "'Enforcing' not in selinux_status.stdout"
      tags: [always]

  roles:
    - role: base
      tags: [base]
    - role: podman
      tags: [podman]
    - role: mail
      tags: [mail]
    - role: nftables
      tags: [nftables, network]
    - role: fail2ban
      tags: [fail2ban]
    - role: dnf_automatic
      tags: [dnf_automatic, updates]
    - role: secrets
      tags: [secrets]
    - role: quadlets
      tags: [quadlets]
    - role: backup
      tags: [backup]
