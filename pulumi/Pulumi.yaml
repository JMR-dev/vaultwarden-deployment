name: vaultwarden
runtime:
  name: go
  options:
    # Built by CI (`go build -o bin/vaultwarden .`) before any pulumi command;
    # locally run the same build first.
    binary: ./bin/vaultwarden
description: |
  Vaultwarden app stack: one GCE VM + its data disk per stack (disposable,
  production). Network, addresses, DNS, registry and IAM come from the
  owner-run platform stack (../platform).

config:
  vaultwarden:zone:
    description: GCE zone (us-east1 has b, c, d -- there is no us-east1-a)
  vaultwarden:machineType:
    description: GCE machine type
    default: e2-small
  vaultwarden:bootDiskGb:
    description: Boot disk size in GB
    default: 20
  vaultwarden:dataDiskGb:
    description: Data disk (/data) size in GB; can grow in place, never shrink
    default: 10
  vaultwarden:snapshotRetentionDays:
    description: Days to keep the daily data-disk snapshots
    default: 7
  vaultwarden:deleteProtection:
    description: |
      Pulumi-protect the data disk and set API deletion protection on the disk's
      instance. Required for production; leave false on disposable so
      destroy/up cycles work.
    default: false
